name: Apply Phase 7 formatting once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'phase7/domain-shift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Format Phase 7 branch
        run: |
          python -m pip install "ruff==0.16.0"
          git fetch origin phase7/domain-shift
          git switch -C phase7/domain-shift origin/phase7/domain-shift
          ruff format \
            src/geoai_aquaculture/domain_shift/diagnostics.py \
            src/geoai_aquaculture/domain_shift/runner.py
          rm -f .github/phase7-format-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff 0.16 Phase 7 formatting"
          git push origin HEAD:phase7/domain-shift
      - name: Remove one-time workflow from main
        run: |
          git switch main
          git pull --ff-only origin main
          git rm .github/workflows/phase7-format-once.yml
          git commit -m "chore: remove one-time Phase 7 formatter"
          git push origin main

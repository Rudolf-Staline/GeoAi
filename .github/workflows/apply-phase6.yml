name: Apply Phase 6 patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/phase6-temporal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Decode and apply Phase 6 commit
        run: |
          cat .github/phase6-patch/part_* | base64 --decode | gzip --decompress > /tmp/phase6.patch
          git am /tmp/phase6.patch
          git rm -r .github/phase6-patch .github/workflows/apply-phase6.yml
          git commit --amend --no-edit
          git push origin HEAD:${{ github.head_ref }}

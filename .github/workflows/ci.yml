name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validated numerical stack
        run: |
          python -m pip install \
            "numpy==2.3.5" \
            "pandas==2.2.3" \
            "scikit-learn==1.8.0"
          python -m pip install -e ".[dev,trees]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests
        run: pytest

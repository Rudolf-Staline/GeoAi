name: Format Phase 8 final once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'phase8/final-delivery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8/final-delivery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format remaining Phase 8 files
        shell: bash
        run: |
          if [ ! -f .phase8-format-trigger ]; then
            echo 'No trigger; nothing to do.'
            exit 0
          fi
          python -m pip install 'ruff==0.16.0'
          ruff format \
            src/geoai_aquaculture/ensemble/calibration.py \
            src/geoai_aquaculture/ensemble/config.py \
            src/geoai_aquaculture/ensemble/oof.py
          rm -f .phase8-format-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/geoai_aquaculture/ensemble/calibration.py \
            src/geoai_aquaculture/ensemble/config.py \
            src/geoai_aquaculture/ensemble/oof.py .phase8-format-trigger
          git commit -m 'style: format Phase 8 final modules'
          git push origin HEAD:phase8/final-delivery
      - name: Remove one-time formatter from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-phase8-final.yml
          git commit -m 'chore: remove one-time Phase 8 formatter'
          git push origin main

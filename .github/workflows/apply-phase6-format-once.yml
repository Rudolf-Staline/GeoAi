name: Apply Phase 6 formatting once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply formatting to Phase 6 branch
        run: |
          git fetch origin phase6/compact-gru
          git switch -C phase6/compact-gru origin/phase6/compact-gru
          git apply --check .github/phase6-format.patch
          git apply .github/phase6-format.patch
          git apply --check .github/phase6-format-followup.patch
          git apply .github/phase6-format-followup.patch
          rm .github/phase6-format.patch
          rm .github/phase6-format-followup.patch
          rm .github/phase6-format-trigger.txt
          rm .github/workflows/phase6-format-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff 0.16 formatting"
          git push origin HEAD:phase6/compact-gru
      - name: Remove one-time workflow from main
        run: |
          git switch main
          git pull --ff-only origin main
          git rm .github/workflows/apply-phase6-format-once.yml
          git commit -m "chore: remove one-time Phase 6 formatter"
          git push origin main

name: Fix Phase 9 once

on:
  push:
    branches: [main]
    paths: [.phase9-fix-trigger]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9/oof-gating
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Phase 9 corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/geoai_aquaculture/ensemble/gating.py')
          text = path.read_text()
          text = text.replace(
              'from typing import Any, Iterable\n',
              'from collections.abc import Iterable\nfrom typing import Any\n',
          )
          old = '''    groups: Iterable[tuple[Any, pd.DataFrame]]
    if "repeat" in frame.columns:
        groups = frame.groupby("repeat", sort=False, observed=True)
    else:
        groups = [(0, frame)]
    for _, group in groups:
        indices = group.index.to_numpy(dtype=np.int64)
'''
          new = '''    group_positions: Iterable[np.ndarray]
    if "repeat" in frame.columns:
        group_positions = frame.groupby(
            "repeat", sort=False, observed=True
        ).indices.values()
    else:
        group_positions = (np.arange(frame.shape[0], dtype=np.int64),)
    for positions in group_positions:
        indices = np.asarray(positions, dtype=np.int64)
'''
          if old not in text:
              raise SystemExit('expected boundary-index block not found')
          path.write_text(text.replace(old, new))
          PY
          python -m pip install 'ruff==0.16.0'
          ruff check --fix src/geoai_aquaculture/ensemble/gating.py tests/test_phase9_gating.py
          ruff format src/geoai_aquaculture/ensemble/gating.py tests/test_phase9_gating.py scripts/build_oof_gate_submission.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/geoai_aquaculture/ensemble/gating.py tests/test_phase9_gating.py scripts/build_oof_gate_submission.py
          git commit -m 'fix: harden Phase 9 gate indexing and style'
          git push origin HEAD:phase9/oof-gating
      - name: Remove one-time workflow from main
        run: |
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/fix_phase9_once.yml .phase9-fix-trigger
          git add -A
          git commit -m 'ci: remove one-time Phase 9 fix workflow'
          git push origin main

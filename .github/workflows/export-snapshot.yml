name: Export repository snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=artifacts --exclude=data/raw --exclude='*.csv' -czf /tmp/geoai-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: geoai-source
          path: /tmp/geoai-source.tar.gz
          if-no-files-found: error
          retention-days: 1

name: Apply Phase 6 CI style fix

on:
  push:
    branches: [phase6/compact-gru]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/compact-gru
          fetch-depth: 0
      - name: Apply verified style patch
        run: |
          git apply --check .github/phase6-ci-rest.patch
          git apply .github/phase6-ci-rest.patch
          rm .github/phase6-ci-rest.patch
          rm .github/workflows/phase6-autofix.yml
      - name: Commit clean branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy Ruff 0.16 CI"
          git push origin HEAD:phase6/compact-gru

name: Fix Phase 8 quality once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'phase8/final-delivery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8/final-delivery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact CI fixes
        shell: bash
        run: |
          if [ ! -f .phase8-ci-fix-trigger ]; then
            echo 'No trigger; nothing to do.'
            exit 0
          fi
          python -m pip install 'ruff==0.16.0'
          python - <<'PY'
          from pathlib import Path

          support = Path('src/geoai_aquaculture/ensemble/delivery_support.py')
          text = support.read_text(encoding='utf-8')
          text = text.replace(
              '    for iterations in range(1, 101):\n',
              '    for iteration in range(1, 101):\n        iterations = iteration\n',
          )
          support.write_text(text, encoding='utf-8')

          test = Path('tests/test_phase8.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'match="Test.csv ID order"',
              'match=r"Test\\.csv ID order"',
          )
          test.write_text(text, encoding='utf-8')
          PY
          ruff check --fix notebooks/99_final_submission.ipynb \
            src/geoai_aquaculture/ensemble/delivery.py \
            src/geoai_aquaculture/ensemble/delivery_support.py \
            src/geoai_aquaculture/ensemble/final_fit.py \
            tests/test_phase8.py
          ruff format notebooks/99_final_submission.ipynb \
            src/geoai_aquaculture/ensemble/delivery.py \
            src/geoai_aquaculture/ensemble/delivery_support.py \
            src/geoai_aquaculture/ensemble/final_fit.py \
            tests/test_phase8.py
          rm -f .phase8-ci-fix-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/99_final_submission.ipynb \
            src/geoai_aquaculture/ensemble/delivery.py \
            src/geoai_aquaculture/ensemble/delivery_support.py \
            src/geoai_aquaculture/ensemble/final_fit.py \
            tests/test_phase8.py .phase8-ci-fix-trigger
          git commit -m 'fix: satisfy Phase 8 quality checks'
          git push origin HEAD:phase8/final-delivery
      - name: Remove one-time workflow from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-phase8-quality.yml
          git commit -m 'chore: remove one-time Phase 8 quality fixer'
          git push origin main

experiment:
  id: EXP-TAB-005-LGB-OPTICAL
  hypothesis: Optical bands and physical indices may provide a complementary water/vegetation expert despite cloud gaps.
  feature_set: optical
  weighting: equal_original
  seed: 4100
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 10
  allowed_stages: [screen, full]
  threshold: 0.5
  notes: Registry-selected optical bands, indices, aggregates, optical validity and neutral window metadata only.
  model:
    family: lightgbm
    name: constrained_depth
    hypothesis: Constrained interactions should limit overfitting among the 515 optical and index features.
    parameters:
      objective: binary
      n_estimators: 700
      learning_rate: 0.03
      num_leaves: 31
      max_depth: 5
      min_child_samples: 40
      colsample_bytree: 0.85
      subsample: 0.90
      subsample_freq: 1
      reg_alpha: 0.3
      reg_lambda: 3.0
      max_bin: 127

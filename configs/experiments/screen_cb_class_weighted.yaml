experiment:
  id: SCR-TAB-CB-CLASSWT
  hypothesis: Fold-local balanced class weights may improve fixed-threshold F1 without compromising ranking.
  feature_set: full
  weighting: equal_original_class_weighted
  seed: 3104
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 0
  allowed_stages: [smoke, screen]
  threshold: 0.5
  notes: Class weights are derived only from each fold's training originals.
  model:
    family: catboost
    name: medium_depth_class_weighted
    hypothesis: The medium profile isolates the effect of fold-local balanced class weights.
    parameters:
      iterations: 650
      learning_rate: 0.04
      depth: 6
      l2_leaf_reg: 8.0
      random_strength: 0.5
      rsm: 0.85
      bootstrap_type: Bayesian
      bagging_temperature: 0.5
      loss_function: Logloss
      eval_metric: Logloss

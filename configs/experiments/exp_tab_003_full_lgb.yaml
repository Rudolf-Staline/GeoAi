experiment:
  id: EXP-TAB-003-LGB-FULL
  hypothesis: The complete aligned Phase 3 representation should combine chronology, invariant physics and explicit missingness most effectively.
  feature_set: full
  weighting: equal_original
  seed: 4100
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 10
  allowed_stages: [screen, full]
  threshold: 0.5
  notes: Equal-original finalist using all 688 registry features.
  model:
    family: lightgbm
    name: constrained_depth
    hypothesis: The strongest equal-original LightGBM structure from Stage B should model cross-group interactions conservatively.
    parameters:
      objective: binary
      n_estimators: 700
      learning_rate: 0.03
      num_leaves: 31
      max_depth: 5
      min_child_samples: 40
      colsample_bytree: 0.85
      subsample: 0.90
      subsample_freq: 1
      reg_alpha: 0.3
      reg_lambda: 3.0
      max_bin: 127

experiment:
  id: EXP-TAB-003-CB-FULL-CLASSWT
  hypothesis: Fold-local class weighting may preserve the strongest CatBoost worst-fold behavior over all repeats.
  feature_set: full
  weighting: equal_original_class_weighted
  seed: 3104
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 10
  allowed_stages: [full]
  threshold: 0.5
  notes: Second CatBoost finalist; class weights are learned only from each training fold's originals.
  model:
    family: catboost
    name: medium_depth_class_weighted
    hypothesis: The repeat-0 worst-fold leader tests fixed-threshold robustness across all repeats.
    parameters:
      iterations: 650
      learning_rate: 0.04
      depth: 6
      l2_leaf_reg: 8.0
      random_strength: 0.5
      rsm: 0.85
      bootstrap_type: Bayesian
      bagging_temperature: 0.5
      loss_function: Logloss
      eval_metric: Logloss

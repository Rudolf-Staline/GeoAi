experiment:
  id: EXP-TAB-002-LGB-INVARIANT
  hypothesis: Invariant temporal summaries should reduce sensitivity to relative placement while retaining physical and missingness structure.
  feature_set: invariant
  weighting: equal_original
  seed: 4100
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 10
  allowed_stages: [screen, full]
  threshold: 0.5
  notes: Registry-selected 450 aggregate channels plus 46 missingness and window metadata features.
  model:
    family: lightgbm
    name: constrained_depth
    hypothesis: Depth-constrained boosting should exploit aggregate nonlinearities without excessive interaction order.
    parameters:
      objective: binary
      n_estimators: 700
      learning_rate: 0.03
      num_leaves: 31
      max_depth: 5
      min_child_samples: 40
      colsample_bytree: 0.85
      subsample: 0.90
      subsample_freq: 1
      reg_alpha: 0.3
      reg_lambda: 3.0
      max_bin: 127

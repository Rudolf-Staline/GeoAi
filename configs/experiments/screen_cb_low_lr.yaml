experiment:
  id: SCR-TAB-CB-LOWLR
  hypothesis: A lower learning rate may improve probability ranking and stability if early stopping controls runtime.
  feature_set: full
  weighting: equal_original
  seed: 3103
  early_stopping_rounds: 90
  smoke_iteration_limit: 20
  permutation_feature_count: 0
  allowed_stages: [smoke, screen]
  threshold: 0.5
  notes: Predeclared Stage B profile screen.
  model:
    family: catboost
    name: lower_learning_rate
    hypothesis: More small boosting steps should smooth probabilities across temporal views.
    parameters:
      iterations: 950
      learning_rate: 0.025
      depth: 6
      l2_leaf_reg: 10.0
      random_strength: 0.5
      rsm: 0.85
      bootstrap_type: Bayesian
      bagging_temperature: 0.5
      loss_function: Logloss
      eval_metric: Logloss

experiment:
  id: SCR-TAB-CB-MEDIUM
  hypothesis: Moderate depth should capture sensor interactions without the variance of a deep tree.
  feature_set: full
  weighting: equal_original
  seed: 3102
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 0
  allowed_stages: [smoke, screen]
  threshold: 0.5
  notes: Predeclared Stage B profile screen.
  model:
    family: catboost
    name: medium_depth
    hypothesis: Depth six and moderate regularization should improve physical interaction modeling.
    parameters:
      iterations: 650
      learning_rate: 0.04
      depth: 6
      l2_leaf_reg: 8.0
      random_strength: 0.5
      rsm: 0.85
      bootstrap_type: Bayesian
      bagging_temperature: 0.5
      loss_function: Logloss
      eval_metric: Logloss

experiment:
  id: EXP-TAB-001-LGB-RELATIVE
  hypothesis: Relative-position measurements and explicit masks retain short-window chronology without aggregate redundancy.
  feature_set: relative
  weighting: equal_original
  seed: 4100
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 10
  allowed_stages: [screen, full]
  threshold: 0.5
  notes: Registry-selected 192 monthly channels plus 46 missingness and window metadata features.
  model:
    family: lightgbm
    name: constrained_depth
    hypothesis: The retained equal-original LightGBM profile permits chronology interactions while limiting interaction depth.
    parameters:
      objective: binary
      n_estimators: 700
      learning_rate: 0.03
      num_leaves: 31
      max_depth: 5
      min_child_samples: 40
      colsample_bytree: 0.85
      subsample: 0.90
      subsample_freq: 1
      reg_alpha: 0.3
      reg_lambda: 3.0
      max_bin: 127

experiment:
  id: SCR-TAB-LGB-CONSTRAINED
  hypothesis: Explicit depth constraints may improve temporal-slice stability while allowing more leaves.
  feature_set: full
  weighting: equal_original
  seed: 3202
  early_stopping_rounds: 70
  smoke_iteration_limit: 20
  permutation_feature_count: 0
  allowed_stages: [smoke, screen]
  threshold: 0.5
  notes: Predeclared Stage B profile screen.
  model:
    family: lightgbm
    name: constrained_depth
    hypothesis: Depth five limits interaction order while 31 leaves retain local nonlinearities.
    parameters:
      objective: binary
      n_estimators: 700
      learning_rate: 0.03
      num_leaves: 31
      max_depth: 5
      min_child_samples: 40
      colsample_bytree: 0.85
      subsample: 0.90
      subsample_freq: 1
      reg_alpha: 0.3
      reg_lambda: 3.0
      max_bin: 127

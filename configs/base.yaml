project:
  name: geoai-aquaculture
  seed: 20260728

data:
  train_path: data/raw/Train.csv
  test_path: data/raw/Test.csv
  sample_submission_path: data/raw/SampleSubmission.csv
  id_column: ID
  target_column: label
  missing_sentinel: -9999.0
  months: 12
  radar_bands: [VH, VV]
  optical_bands: [blue, green, nir, nira, re1, re2, re3, red, swir1, swir2]

validation:
  strategy: stratified_group_kfold
  seed: 2026
  n_splits: 5
  n_repeats: 3
  threshold: 0.5
  window_lengths: [4, 5, 6]
  split_before_augmentation: true
  primary_window_mode: sampled
  sampled_windows_per_original: 8
  validation_window_seed: 2027
  aggregation_method: mean
  trimmed_mean_fraction: 0.10
  seasons:
    early_year: [1, 2, 3]
    mid_year: [4, 5, 6]
    late_year: [7, 8, 9]
  optical_severe_limit: 0.50
  optical_high_completeness: 0.80
  robust_score_weights:
    mean_combined: 0.50
    worst_fold: 0.20
    worst_window_length: 0.15
    worst_season: 0.15
  exhaustive_stress_enabled: false
  reference_estimator_enabled: true
  similarity_holdout_fraction: 0.20
  similarity_holdout_min_samples: 100
  cluster_n_clusters: 5
  cluster_min_size: 100

augmentation:
  enabled: true
  use_test_missingness_masks: true
  exhaustive_windows: false
  windows_per_sample: 8
  temporal_dropout_enabled: false
  temporal_dropout_probability: 0.0
  optical_dropout_enabled: false
  optical_dropout_probability: 0.15

features:
  version: phase3_v1
  epsilon: 0.000001
  bands:
    vv: VV
    vh: VH
    blue: blue
    green: green
    red: red
    red_edge_1: re1
    red_edge_2: re2
    red_edge_3: re3
    nir: nir
    narrow_nir: nira
    swir1: swir1
    swir2: swir2

tabular:
  validation_artifacts_dir: artifacts/validation
  experiments_artifacts_dir: artifacts/experiments
  fold_manifest_fingerprint: 4dbc9029f242c5ff4f8d2e23b0fb0d83334d993c1a4ecd7ce95e8e18c37ceece
  validation_window_fingerprint: 89ef5e9a108a4cad09582db82ce1970dbf4873cbb3b01692c96a8fcc54b14492
  feature_schema_fingerprint: af93d8bfc1406583e1834519fb5012b97052446e44674fbb8a0cf917bc9032b9
  expected_original_count: 1821
  expected_repeat_count: 3
  expected_full_oof_rows: 5463
  expected_feature_count: 688
  permutation_feature_count: 10
  cpu_threads: 4

reporting:
  artifacts_dir: artifacts
  save_oof: true
  save_fold_metrics: true
  save_environment_manifest: true

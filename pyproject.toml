[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-aquaculture"
version = "0.1.0"
description = "Leakage-safe research pipeline for aquaculture pond identification from incomplete satellite time series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.0"]
trees = ["catboost>=1.2", "lightgbm>=4.3"]
deep = ["torch>=2.2"]
notebook = [
  "jupyterlab>=4.0",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "matplotlib>=3.8",
  "shap>=0.46",
  "codecarbon>=2.7",
]
all = ["geoai-aquaculture[dev,trees,deep,notebook]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
